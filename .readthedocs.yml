# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/tudatpy/source/conf.py
  builder: html
  fail_on_warning: false

build:
  os: "ubuntu-24.04"
  tools:
    python: "miniconda-latest"
  jobs:
    pre_install:
      - DOCS_COMMIT=8199cf40de988fa50cd1dbddf32bbed453c8b5b9 ; echo Using docs from $DOCS_COMMIT ; git checkout $DOCS_COMMIT -- docs/

      # The pre-install step enables building the docs from the same source
      # revision as the TudatPy package being tested. Read the Docs creates the
      # conda environment before this step, so the environment still comes from
      # this branch's docs/tudatpy/environment_readthedocs.yaml and therefore
      # uses the tudat-team/label/test channel.

conda:
  environment: docs/tudatpy/environment_readthedocs.yaml

