repos:
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.0
    hooks:
    -   id: black
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v22.1.5
  hooks:
  - id: clang-format
    types_or: [c++, c]
    args: [-style=file:.clang-format]
exclude: tests/test_tudat/src/interface/json/inputs
