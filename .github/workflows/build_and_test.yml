# This workflow builds and tests the tudat source code on Windows, Linux, and MacOS using GitHub Actions. It is triggered upon push and pull requests to master, develop, and feature branches.
# This Github actions workflow automates the build and test process of the tudat source code on Windows, Linux, and MacOS. The workflow is triggered upon push and pull requests to master, develop, and feature branches. The workflow is built on top of the GitHub starter workflow for CMake on multiple platforms.
# ccache is used to cache previous compilation results to speed up the build process across s
# The workflow is built on top of the GitHub starter workflow for CMake on multiple platforms https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml


name: Build and Test w/ Conda

on:
  push:
    branches: [ "master", "develop"]
  pull_request:
    branches: [ "master", "develop"]
  workflow_dispatch:

jobs:
  download-data:

    runs-on: ubuntu-latest

    steps:
    - name: Download and place MCD files
      env:
        GH_TOKEN: ${{ secrets.MCD_REPO_TOKEN }}
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/temp_mcd"
        mkdir -p "${{ github.workspace }}/third_parties/mcd/interfaces/c_interfaces"
        gh release download v1 --repo tudat-team/MCD --pattern "dataset.tgz" --dir "${{ github.workspace }}/temp_mcd"
        tar -xzf "${{ github.workspace }}/temp_mcd/dataset.tgz" -C "${{ github.workspace }}/temp_mcd" --strip-components=1
        cp -r "${{ github.workspace }}/temp_mcd/data" "${{ github.workspace }}/third_parties/mcd/"
        cp "${{ github.workspace }}/temp_mcd/source/MCD.F90" "${{ github.workspace }}/third_parties/mcd/MCD.F90"
        cp "${{ github.workspace }}/temp_mcd/source/mcd.h" "${{ github.workspace }}/third_parties/mcd/interfaces/c_interfaces/mcd.h"

    - name: Upload MCD files
      uses: actions/upload-artifact@v4
      with:
        name: mcd-files
        path: ${{ github.workspace }}/third_parties/mcd/**
        retention-days: 1

  build-and-test:

    needs: download-data

    env:
        CACHE_NUMBER: 0

    runs-on: ${{ matrix.platform.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # NOTE: Do not mix system compilers with conda compilers when
      # building under conda.  This invites version clashes with
      # dependencies that are also installed system-wide.
      #
      # Compiler meta-packages provides the platform specific packages:
      # - Linux: gcc
      # - Windows: gcc
      # - OSX: clang
      #
      # If you want to add a config that can vary for a given
      # platform, add it as a top-level key under matrix, however if
      # it is a property of the platform, you should create a key
      # under "platform:".
      #
      # E.g. to add more build types (Release, Debug, RelWithDebInfo,
      # etc.) customize the build_type: list, it will be added to all
      # platforms.  However, if you want to add a build type for a
      # subset of platforms, you should use include: (see commented
      # out example below) or use exclude: along with adding to
      # "build_type:".
      #
      # The precendence rules used by GH to generate matrix values is
      # non-intuitive.  You can review the rules here:
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
      matrix:
        platform:
          - os: ubuntu-latest
            label: linux-64
            path_conda_env: /usr/share/miniconda/envs/tudat
            cmake_generator: Unix Makefiles
            build_jobs: 3
            ccache: ON
          - os: windows-latest
            label: win-64
            path_conda_env: C:\Miniconda\envs\tudat
            cmake_generator: Ninja
            build_jobs: 2
            ccache: OFF
          - os: macos-latest
            label: osx-64
            path_conda_env: /Users/runner/miniconda3/envs/tudat
            cmake_generator: Unix Makefiles
            build_jobs: 2
            ccache: ON
        build_type: [Release]
        compilers: [{c: gcc, cxx: g++}, {c: clang, cxx: clang++}]
        # include:
        #   - platform: {os: windows-latest}
        #     build_type: [Release, Debug]
        exclude:
          - platform: {os: windows-latest}
            compilers: {c: clang, cxx: clang++}
          - platform: {os: ubuntu-latest}
            compilers: {c: clang, cxx: clang++}
          - platform: {os: macos-latest}
            compilers: {c: gcc, cxx: g++}

    steps:
    - uses: actions/checkout@v6

    - name: Download MCD files
      uses: actions/download-artifact@v4
      with:
        name: mcd-files
        path: ${{ github.workspace }}/third_parties/mcd

    - name: Setup conda environment
      # This step creates an empty conda environment with the name 'tudat' and activates it. Use latest conda version.
      uses: conda-incubator/setup-miniconda@v4
      with:
           activate-environment: tudat
           auto-activate: false
           channels: conda-forge,tudat-team
           conda-remove-defaults: true

    # - name: Get date
    #   # Get the current date and time in UTC format. This step is used to create a unique cache key for the conda environment cache by appending the date to the cache key.
    #   # GitHub cache action doucmentation recommends refreshing the cache every 24 hours to avoid inconsistencies of package versions between the CI pipeline and local installations. This is ensured by appending the date to the cache key.See https://github.com/marketplace/actions/setup-miniconda#caching-environments for more detail.
    #   id: get-date
    #   shell: bash
    #   run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

    # - name: Cache conda environment
    #   # Cache the conda environment to avoid re-installing the same packages every time the workflow runs. The cache key is based on the environment.yml file, the operating system, and the date. The cache is restored if the cache key matches the cache key of the previous run.
    #   uses: actions/cache@v4
    #   with:
    #       path: ${{ matrix.platform.path_conda_env }}
    #       key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}-${{steps.get-date.outputs.today}}
    #   id: cache

    - name: Create conda environment from environment.yml - ${{ matrix.platform.os }}
      # Update the tudat conda environment created using the environment.yml file if the cache is not restored
      # if: steps.cache.outputs.cache-hit != 'true'
      run: conda env update -n tudat -f environment.yaml

    - name: Show full conda package list
      shell: bash -l {0}
      run: |
        echo "=== Conda environment information ==="
        conda info
        echo ""
        echo "=== Installed packages in tudat environment ==="
        conda list

    - name: Setup MSVC for Ninja
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compiler diagnostics
      shell: bash -l {0}
      run: |
        conda activate tudat

        echo "runner.os=${{ runner.os }}"
        echo "CONDA_PREFIX=${CONDA_PREFIX}"
        echo "CC=${CC:-}"
        echo "CXX=${CXX:-}"
        echo "FC=${FC:-}"
        echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-}"
        echo "PATH=${PATH}"

        for tool in cmake ninja make gcc g++ clang clang++ cl flang-new flang gfortran windres; do
          echo "---- ${tool} ----"
          command -v "${tool}" || true
          type -a "${tool}" || true
        done

        conda_prefix="${CONDA_PREFIX}"
        if command -v cygpath >/dev/null 2>&1; then
          conda_prefix="$(cygpath -u "${conda_prefix}")"
        fi
        echo "Compiler-like executables inside ${conda_prefix}:"
        find "${conda_prefix}" -type f \( \
          -iname "cl.exe" -o \
          -iname "gcc.exe" -o \
          -iname "g++.exe" -o \
          -iname "clang.exe" -o \
          -iname "clang++.exe" -o \
          -iname "flang*.exe" -o \
          -iname "*gfortran*.exe" -o \
          -name "gcc" -o \
          -name "g++" -o \
          -name "clang" -o \
          -name "clang++" -o \
          -name "flang*" -o \
          -name "*gfortran*" \
        \) | sort || true

    # - name: Download tudat resources data files for Linux and MacOS
    #   # The data files in tudat-resources are downloaded upon the installation of
    #   # the tudat-resources conda package in the previous step, but the data files are
    #   # not cached by the cache action. When the cache is hit, the update environment
    #   # step is skipped, skipping the installation of the tudat-resources package,
    #   # thereby skipping the download of the data files. Therefore, the data files must
    #   # be downloaded manually when the cache is hit.
    #   # This step downloads the data files in the tudat-resources package by running
    #   # the post-link scripts in https://github.com/tudat-team/tudat-resources-feedstock/blob/master/recipe/
    #   if: (runner.os == 'Linux' || runner.os == 'MacOS') && steps.cache.outputs.cache-hit == 'true'
    #   run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/tudat-team/tudat-resources-feedstock/master/recipe/post-link.sh)"

    # - name: Download tudat-resources data files for Windows
    #   if: runner.os == 'Windows' && steps.cache.outputs.cache-hit == 'true'
    #   run: cmd /c "curl -fsSL https://raw.githubusercontent.com/tudat-team/tudat-resources-feedstock/master/recipe/post-link.bat | cmd"

    # - name: Restore cached compilation results
    #   # This third party action will setup ccache on the runner and restore any previously saved cache. Caches are saved automatically by the action after a build.
    #   uses: hendrikmuhs/ccache-action@v1.2.12
    #   with:
    #     key: ${{ matrix.platform.os }}-${{ matrix.build_type }}

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      shell: bash -l {0}
      run: |
        conda activate tudat

        selected_c_compiler="${{ matrix.compilers.c }}"
        selected_cxx_compiler="${{ matrix.compilers.cxx }}"
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          selected_c_compiler="cl"
          selected_cxx_compiler="cl"
        fi

        cmake_args=(
          -B "${{ github.workspace }}/build"
          -S "${{ github.workspace }}"
          -G "${{ matrix.platform.cmake_generator }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER="${selected_cxx_compiler}"
          -DCMAKE_C_COMPILER="${selected_c_compiler}"
          -DTUDAT_BUILD_GITHUB_ACTIONS=${{ matrix.platform.ccache }}
          -DTUDAT_BUILD_WITH_TEST_PCH=ON
          -DTUDAT_BUILD_WITH_PCH=ON
          -DTUDAT_BUILD_WITH_MCD_INTERFACE=ON
          -DTUDAT_BUILD_FOR_REDUCED_COMPILE_TIME=ON
          -DCMAKE_UNITY_BUILD=ON
        )

        conda_prefix="${CONDA_PREFIX}"
        if command -v cygpath >/dev/null 2>&1; then
          conda_prefix="$(cygpath -u "${conda_prefix}")"
        fi

        selected_fortran_compiler="${FC:-}"
        if [[ -n "${selected_fortran_compiler}" ]] && command -v "${selected_fortran_compiler}" >/dev/null 2>&1; then
          selected_fortran_compiler="$(command -v "${selected_fortran_compiler}")"
        fi
        if [[ -n "${selected_fortran_compiler}" ]] && command -v cygpath >/dev/null 2>&1; then
          selected_fortran_compiler="$(cygpath -u "${selected_fortran_compiler}")"
        fi

        if [[ -z "${selected_fortran_compiler}" || "${selected_fortran_compiler}" != "${conda_prefix}"/* ]]; then
          selected_fortran_compiler=""
          for compiler_name in \
            flang-new.exe flang.exe x86_64-w64-mingw32-gfortran.exe gfortran.exe \
            flang-new flang gfortran
          do
            selected_fortran_compiler="$(find "${conda_prefix}" -type f -name "${compiler_name}" -print -quit)"
            if [[ -n "${selected_fortran_compiler}" ]]; then
              break
            fi
          done
        fi

        if [[ -z "${selected_fortran_compiler}" ]]; then
          echo "::error::Could not find a Fortran compiler inside ${conda_prefix}; refusing to use a system compiler for MCD."
          find "${conda_prefix}" -type f \( -iname "*flang*" -o -iname "*gfortran*" \) || true
          exit 1
        fi

        if command -v cygpath >/dev/null 2>&1; then
          selected_fortran_compiler="$(cygpath -m "${selected_fortran_compiler}")"
        fi

        echo "Using C compiler: ${selected_c_compiler}"
        echo "Using CXX compiler: ${selected_cxx_compiler}"
        echo "Using conda Fortran compiler: ${selected_fortran_compiler}"
        cmake_args+=("-DCMAKE_Fortran_COMPILER=${selected_fortran_compiler}")

        printf 'CMake configure arguments:\n'
        printf '  %q\n' "${cmake_args[@]}"

        cmake "${cmake_args[@]}"

    - name: Dump CMake configure diagnostics
      if: failure()
      shell: bash -l {0}
      run: |
        for file in \
          "${{ github.workspace }}/build/CMakeCache.txt" \
          "${{ github.workspace }}/build/CMakeFiles/CMakeConfigureLog.yaml" \
          "${{ github.workspace }}/build/CMakeFiles/CMakeOutput.log" \
          "${{ github.workspace }}/build/CMakeFiles/CMakeError.log"
        do
          if [[ -f "${file}" ]]; then
            echo "===== ${file} ====="
            cat "${file}"
          fi
        done

    - name: Debug
      run: |
        conda info
        conda list

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator). Use multiple cpu cores available in the runner.
      shell: bash -l {0}
      run: cmake --build "${{ github.workspace }}/build" --config "${{ matrix.build_type }}" -j${{ matrix.platform.build_jobs }}

    - name: Test
      working-directory: "${{ github.workspace }}/build"
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure -j4

    - name: Dump CTest diagnostics
      if: failure()
      working-directory: "${{ github.workspace }}/build"
      shell: bash -l {0}
      run: |
        for file in \
          Testing/Temporary/LastTestsFailed.log \
          Testing/Temporary/LastTest.log
        do
          if [[ -f "${file}" ]]; then
            echo "===== ${file} ====="
            cat "${file}"
          fi
        done
