# This workflow is triggered every Sunday at 23:00 UTC and checks if there has
# been a commit in the last week on the develop branch of tudatpy repository.

# If there has been a commit, it bumps the version in the develop branch of
# the tudatpy repository, creates a tag with the version numbers and pushes
# both the commit and the tag to the repository, and then bumps the version in
# the develop branch of the tudatpy-feedstock repository and pushes the commit
# and the tag to the repository.

# This workflow can also be triggered manually from the Actions tab.
#
# This workflow uses GitHub App installation tokens to push the changes.

# This workflow file must be in the master (default branch) of the tudatpy repository because scheduled workflows are only triggered on the default branch.

# Required repository configuration in tudatpy:
# - Variable: VERSION_BUMPER_APP_ID
# - Secret:   VERSION_BUMPER_PRIVATE_KEY

name: Bump dev version in tudatpy and tudatpy-feedstock if new commit in last week

on:
    schedule:
        - cron: '0 23 * * 0'  # This triggers the workflow every Sunday at 23:00 UTC.
    workflow_dispatch:       # This facilitates manual triggering of the workflow from the Actions tab of the repository in case the scheduled run fails.


permissions:
  contents: write
  actions: write

jobs:

  check_recent_1w_commit:
        runs-on: ubuntu-latest
        name: Check latest commits
        outputs:
          should_run: ${{ steps.should_bump_version.outputs.should_run }}
        steps:
          - uses: actions/checkout@v6
            with:
              ref: develop  # Check the latest commits on the develop branch of tudatpy repository
          - name: print latest_commit
            run: git log -n 1 --pretty=format:"%H"


          - id: should_bump_version
            continue-on-error: true
            name: check whether any commit was made in the last week
            run: |
              STR=$(git rev-list --after="7 days ago" HEAD)
              if test -z "$STR"; then
                echo "should_run=false" >> $GITHUB_OUTPUT
              else
                echo "should_run=true" >> $GITHUB_OUTPUT
              fi
            # If there has been at least one commit in the last 7 days on develop,
            # git rev-list --after="7 days ago" HEAD will return a non-empty string.
            # test -z "$STR" checks if STR is empty. If it is empty, should_run is set to false.
            # Otherwise, should_run is set to true.

  bump-version_tudatpy:
    needs: check_recent_1w_commit
    if: ${{ needs.check_recent_1w_commit.outputs.should_run != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    name: Bump version in tudatpy repository

    steps:
      - name: Generate GitHub App token for tudatpy
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.VERSION_BUMPER_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMPER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Bump My Version and bump the version
        run: |
            python3 -m venv venv
            source venv/bin/activate
            pip install 'bump-my-version>=1,<2'
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"
            bump-my-version bump dev --config-file .bumpversion.cfg --verbose
      - name: Push tag to tudatpy repository
        run: git push origin --follow-tags
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  bump_version_tudatpy_feedstock:
    needs: check_recent_1w_commit
    if: ${{ needs.check_recent_1w_commit.outputs.should_run != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    name: bump version and create tag in tudatpy-feedstock
    steps:
        - name: Generate GitHub App token for tudatpy-feedstock
          id: app-token
          uses: actions/create-github-app-token@v3
          with:
            app-id: ${{ vars.VERSION_BUMPER_APP_ID }}
            private-key: ${{ secrets.VERSION_BUMPER_PRIVATE_KEY }}
            repositories: tudatpy-feedstock

        - name: checkout tudatpy-feedstock
          uses: actions/checkout@v6
          with:
            repository: tudat-team/tudatpy-feedstock
            token: ${{ steps.app-token.outputs.token }}
            ref: develop

        - name: Install Bump My Version and bump the version
          run: |
               python3 -m venv venv
               source venv/bin/activate
               pip install 'bump-my-version>=1,<2'
               git config --global user.email "actions@github.com"
               git config --global user.name "GitHub Actions"
               bump-my-version bump dev --config-file .bumpversion.cfg --verbose
        - name: Reset build number in meta.yml to 0
          shell: bash
          run: |
                sed -i 's/build = ".*" %}/build = "0" %}/' recipe/meta.yaml
                git add recipe/meta.yaml
                git commit --amend --no-edit
        - name: Push tag to tudatpy-feedstock
          run: git push origin --follow-tags
          env:
              GITHUB_TOKEN: ${{ secrets.BUMP_VERSION_NIGHTLY}}
